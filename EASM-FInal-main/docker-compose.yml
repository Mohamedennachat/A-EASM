name: easm

networks:
  easm_internal:
    driver: bridge

volumes:
  pg_data:
  n8n_data:
  nuclei_templates:
  grafana_data:
  prometheus_data:

services:
  # n8n: workflow orchestrator (localhost only). Database, scanner, and
  # observability services are wired in as the pipeline is built up.
  n8n:
    image: n8nio/n8n:latest
    container_name: easm_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      easm_scanner:
        condition: service_started
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_METRICS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: "http://localhost:5678/"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      SCANNER_URL: ${SCANNER_URL}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      SMTP_SENDER: ${SMTP_SENDER}
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY}
      JIRA_PROJECT_ID: ${JIRA_PROJECT_ID}
      JIRA_TASK_ISSUETYPE_ID: ${JIRA_TASK_ISSUETYPE_ID}
      JIRA_SUBTASK_ISSUETYPE_ID: ${JIRA_SUBTASK_ISSUETYPE_ID}
      EMAIL_OWNER: ${EMAIL_OWNER}
      EMAIL_LOW: ${EMAIL_LOW}
      EMAIL_MEDIUM: ${EMAIL_MEDIUM}
      EMAIL_HIGH: ${EMAIL_HIGH}
      JIRA_ACCT_OWNER: ${JIRA_ACCT_OWNER}
      JIRA_ACCT_LOW: ${JIRA_ACCT_LOW}
      JIRA_ACCT_MEDIUM: ${JIRA_ACCT_MEDIUM}
      JIRA_ACCT_HIGH: ${JIRA_ACCT_HIGH}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks: [easm_internal]
    ports:
      - "127.0.0.1:5678:5678"

  # PostgreSQL: EASM state and diff engine
  postgres:
    image: postgres:16-alpine
    container_name: easm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [easm_internal]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Scanner: HTTP to shell tool runner on the internal network only. It has no
  # published ports because it runs arbitrary commands and must never be
  # reachable from the host or the internet.
  easm_scanner:
    build: ./scanner
    image: easm_scanner:local
    container_name: easm_scanner
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      RUN_TIMEOUT: "1200"
    volumes:
      - nuclei_templates:/home/scanner/nuclei-templates
    networks: [easm_internal]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # EASM Control Center: FastAPI plus a single-page app that ties the pipeline
  # together (reads Postgres, triggers the workflow, polls scanner metrics).
  easm_app:
    build: ./app
    image: easm_app:local
    container_name: easm_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      easm_scanner:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCANNER_URL: ${SCANNER_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      SMTP_SENDER: ${SMTP_SENDER}
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_PROJECT_ID: ${JIRA_PROJECT_ID}
      JIRA_TASK_ISSUETYPE_ID: ${JIRA_TASK_ISSUETYPE_ID}
      JIRA_SUBTASK_ISSUETYPE_ID: ${JIRA_SUBTASK_ISSUETYPE_ID}
      EMAIL_OWNER: ${EMAIL_OWNER}
      EMAIL_LOW: ${EMAIL_LOW}
      EMAIL_MEDIUM: ${EMAIL_MEDIUM}
      EMAIL_HIGH: ${EMAIL_HIGH}
      JIRA_ACCT_OWNER: ${JIRA_ACCT_OWNER}
      JIRA_ACCT_LOW: ${JIRA_ACCT_LOW}
      JIRA_ACCT_MEDIUM: ${JIRA_ACCT_MEDIUM}
      JIRA_ACCT_HIGH: ${JIRA_ACCT_HIGH}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_WEBHOOK_URL: http://easm_n8n:5678/webhook/run-easm
      N8N_TEST_WEBHOOK_URL: http://easm_n8n:5678/webhook-test/run-easm
    networks: [easm_internal]
    ports:
      - "127.0.0.1:8080:8000"

  # OpenTelemetry Collector: scrapes n8n and scanner metrics and re-exports them.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: easm_otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    networks: [easm_internal]

  # Prometheus: metrics store.
  prometheus:
    image: prom/prometheus:latest
    container_name: easm_prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [easm_internal]
    ports:
      - "127.0.0.1:9090:9090"

  # Grafana: dashboards, anonymous viewer access for the demo.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: easm_grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [easm_internal]
    ports:
      - "127.0.0.1:3000:3000"
