global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Metrics re-exported by the OpenTelemetry Collector
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # n8n native Prometheus metrics (N8N_METRICS=true)
  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ['n8n:5678']

  # Scanner executor /metrics
  - job_name: easm_scanner
    metrics_path: /metrics
    static_configs:
      - targets: ['easm_scanner:5001']
