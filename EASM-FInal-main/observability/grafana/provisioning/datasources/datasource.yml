apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: EASM-Postgres
    type: postgres
    uid: easmpg
    access: proxy
    url: postgres:5432
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
    editable: true
